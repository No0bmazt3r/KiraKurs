# Local: `pnpm dev` from the repo root (key in apps/api/.env, copied from .env.example).
# Deploy (M5): pnpm --filter api deploy && pnpm --filter api exec wrangler secret put GROQ_API_KEY
# Then set the Worker URL as the VITE_ASK_URL repository variable (Settings → Variables) and redeploy Pages.
name = "kirakurs-ask"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGIN = "https://no0bmazt3r.github.io"

# 10 requests per minute per IP (Workers rate limiting binding)
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
