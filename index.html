<!doctype html>
<html lang="en-MY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KiraKurs</title>
  <meta name="description" content="See how inflation and interest rates move your ringgit before you pay abroad.">
  <meta name="theme-color" content="#0F766E">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/learn" aria-label="KiraKurs home"><span class="logo-mark" aria-hidden="true">K</span><span>KiraKurs</span></a>
      <nav class="tabs" id="tabs" aria-label="Main" hidden></nav>
      <div class="topbar-actions">
        <button class="chip" id="presetChip" type="button" aria-haspopup="dialog"></button>
        <button class="icon-btn" id="themeBtn" type="button"></button>
      </div>
    </div>
    <div class="progress" id="progress" hidden><div class="progress-bar"><span id="progressFill"></span></div><span id="progressText" class="small"></span></div>
  </header>

  <main id="view" tabindex="-1">
    <noscript><p class="card">KiraKurs needs JavaScript to calculate.</p></noscript>
  </main>

  <div class="actionbar" id="actionbar" hidden>
    <div class="actionbar-inner"><button class="btn secondary" id="backBtn" type="button"></button><button class="btn primary" id="nextBtn" type="button"></button></div>
  </div>

  <footer class="footer" id="footer"></footer>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" id="sheetClose" type="button"></button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
