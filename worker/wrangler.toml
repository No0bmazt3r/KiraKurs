# Deploy (M5): cd worker && npx wrangler deploy && npx wrangler secret put GROQ_API_KEY
# Then copy the Worker URL into ASK_URL in js/ask-core.js.
name = "kirakurs-ask"
main = "ask.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGIN = "https://no0bmazt3r.github.io"

# 10 requests per minute per IP (Workers rate limiting binding)
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
